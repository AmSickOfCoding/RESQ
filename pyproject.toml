[project]
name = "resq"
version = "0.1.0"
description = "RESQ - simulated emergency response digital twin"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Only what CI and local testing need. The core itself stays dependency-free.
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
# Makes `import resq` work from the repo root without sys.path hacks in
# every test file. This is what stops CI collecting 0 items.
# "." makes `import resq` and `import src.routing` work from the repo root.
# "src/engine" is Partner B's folder: her allocation.py and models.py are
# imported by name (`import allocation`) from resq/adapters/partner_b.py, and
# PR #5 moved them off the root. Adding the folder to the path is the one-line
# fix - the alternative is rewriting her imports, which would mean editing a
# teammate's module to suit our layout.
pythonpath = [".", "src/engine"]
testpaths = ["tests"]
python_files = ["test_*.py"]
